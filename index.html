<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CronoNotas Equipe — Dez/2026 a Dez/2027</title>
  <style>
    :root {
      --bg-main: #0e131b;
      --bg-surface: #161d29;
      --bg-card: #1d2636;
      --bg-card-hover: #243044;
      --bg-input: #111722;
      --border: #2b374d;
      --border-strong: #425372;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.16);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.16);
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.16);
      --holiday: #a855f7;
      --holiday-soft: rgba(168, 85, 247, 0.16);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --bottom-nav-h: 64px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 calc(var(--bottom-nav-h) + 20px) 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.45;
      min-height: 100vh;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: radial-gradient(circle at top, #182338 0%, #0e131b 70%);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
    }

    .login-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0 0 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .login-sub {
      font-size: 0.83rem;
      color: var(--text-secondary);
      margin: 0 0 14px 0;
    }

    .form-group {
      margin-bottom: 11px;
    }

    .form-group label {
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      font-size: 0.88rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    .privacy-box {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      font-size: 0.77rem;
      color: #a7f3d0;
      margin-bottom: 12px;
    }

    .mode-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      background: var(--accent-soft);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(14, 19, 27, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1rem;
    }

    .user-info-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 4px 9px;
      border-radius: var(--radius-sm);
      font-size: 0.79rem;
    }

    .role-pill {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 700;
      background: var(--warning-soft);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .role-pill.collab {
      background: var(--accent-soft);
      color: #93c5fd;
      border-color: rgba(59, 130, 246, 0.35);
    }

    .subbar {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .viewing-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      flex: 1;
      min-width: 220px;
    }

    .btn-mini {
      background: var(--accent-soft);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-mini:hover {
      background: rgba(59, 130, 246, 0.28);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 14px;
    }

    .schedule-split {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    @media (min-width: 980px) {
      .schedule-split {
        grid-template-columns: 1.85fr 1fr;
      }
      .day-drawer-panel {
        position: sticky;
        top: 96px;
      }
    }

    .participants-section {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px;
      margin-bottom: 12px;
    }

    .participants-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .section-label {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .filter-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .search-input {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 0.8rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .chip-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .chip-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .participants-scroll {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .p-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 0.79rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .p-pill.selected-view {
      border-color: #fff;
      box-shadow: 0 0 0 1px #fff;
    }

    .p-pill.selected-common {
      background: rgba(16, 185, 129, 0.18);
      border-color: var(--success);
      color: #a7f3d0;
    }

    .p-role-tag {
      font-size: 0.66rem;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .p-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .month-select {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 0.95rem;
      font-weight: 700;
      outline: none;
    }

    .btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 11px;
      font-size: 0.81rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn:hover {
      background: var(--bg-card-hover);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .common-summary {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 0.83rem;
    }

    .common-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .common-tag {
      background: var(--bg-card);
      border: 1px solid rgba(16, 185, 129, 0.45);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.77rem;
      cursor: pointer;
    }

    .grid-wrapper {
      overflow-x: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px;
    }

    .calendar-grid {
      min-width: 690px;
    }

    .dow-header {
      display: grid;
      grid-template-columns: 74px repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 5px;
    }

    .dow-cell {
      text-align: center;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-secondary);
      padding: 4px 2px;
    }

    .week-row {
      display: grid;
      grid-template-columns: 74px repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 5px;
      align-items: stretch;
    }

    .week-label {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-secondary);
      padding: 5px 4px;
      text-align: center;
    }

    .day-square {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      min-height: 94px;
      padding: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3px;
      transition: border-color 0.15s;
    }

    .day-square:hover {
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
    }

    .day-square.selected-day {
      border: 2px solid #60a5fa;
      box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.4);
    }

    .day-square.other-month {
      opacity: 0.32;
    }

    .day-square.dimmed {
      opacity: 0.24;
    }

    .day-square.common-highlight {
      border: 2px solid var(--success);
      background: rgba(16, 185, 129, 0.12);
      opacity: 1 !important;
    }

    .day-square.holiday-day {
      background: linear-gradient(180deg, rgba(168, 85, 247, 0.14) 0%, var(--bg-card) 48%);
      border-color: rgba(168, 85, 247, 0.48);
    }

    .day-square.cancelled-day {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.09);
    }

    .day-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3px;
    }

    .day-num {
      font-size: 0.82rem;
      font-weight: 700;
    }

    .day-badges {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge-holiday {
      background: var(--holiday-soft);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 0.62rem;
      font-weight: 700;
    }

    .badge-edit {
      background: var(--warning-soft);
      color: var(--warning);
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 0.62rem;
      font-weight: 700;
    }

    .badge-cancel {
      background: var(--danger-soft);
      color: #fca5a5;
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 0.62rem;
      font-weight: 700;
    }

    .badge-incoming {
      background: var(--accent-soft);
      color: #93c5fd;
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 0.62rem;
      font-weight: 700;
    }

    .holiday-mini-name {
      font-size: 0.66rem;
      color: #d8b4fe;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-note-preview {
      font-size: 0.73rem;
      color: var(--text-primary);
      white-space: pre-line;
      word-break: break-word;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      flex: 1;
    }

    .day-note-preview.empty {
      color: var(--text-muted);
      font-style: italic;
    }

    .day-mentions {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .mention-chip {
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 999px;
      font-weight: 600;
      background: var(--accent-soft);
      color: #bfdbfe;
      border: 1px solid rgba(59, 130, 246, 0.35);
    }

    .day-drawer-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 13px;
    }

    .drawer-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 9px;
      margin-bottom: 10px;
    }

    .drawer-title {
      font-size: 1rem;
      font-weight: 800;
    }

    .drawer-sub {
      font-size: 0.76rem;
      color: var(--text-secondary);
    }

    .holiday-alert-box {
      background: var(--holiday-soft);
      border: 1px solid rgba(168, 85, 247, 0.45);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 0.8rem;
      color: #e9d5ff;
    }

    .activity-block {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      margin-bottom: 9px;
    }

    .activity-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 5px;
      font-size: 0.78rem;
    }

    .status-pill-tag {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 700;
    }

    .st-confirmado {
      background: var(--success-soft);
      color: #6ee7b7;
    }

    .st-pendente {
      background: var(--warning-soft);
      color: #fcd34d;
    }

    .st-cancelado {
      background: var(--danger-soft);
      color: #fca5a5;
    }

    .status-composer {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 12px;
    }

    .status-composer textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px;
      font-size: 0.86rem;
      min-height: 72px;
      resize: vertical;
      outline: none;
      margin-bottom: 8px;
    }

    .status-feed-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 10px;
    }

    .status-feed-card.top-recent {
      border-left: 4px solid var(--success);
    }

    .status-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .alert-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .alert-card.mention-alert {
      border-left: 4px solid var(--accent);
    }

    .alert-card.change-alert {
      border-left: 4px solid var(--warning);
    }

    .chat-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-top: 12px;
    }

    .chat-context-tag {
      display: inline-block;
      background: var(--accent-soft);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.35);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .chat-messages {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
      padding-right: 4px;
    }

    .msg-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 0.83rem;
    }

    .msg-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }

    .chat-form {
      display: flex;
      gap: 6px;
    }

    .chat-form input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 0.84rem;
      outline: none;
    }

    .admin-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 12px;
    }

    .admin-note {
      font-size: 0.8rem;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      margin-bottom: 10px;
    }

    .member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.84rem;
      flex-wrap: wrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 500px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 15px;
    }

    .modal-header {
      display:
