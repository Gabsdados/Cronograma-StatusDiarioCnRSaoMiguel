<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CronoNotas Equipe — Teste de Acesso</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0e131b;
      color: #f1f5f9;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #161d29;
      border: 1px solid #2b374d;
      border-radius: 12px;
      padding: 20px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: bold;
      margin: 12px 0 6px;
      color: #94a3b8;
    }
    select, input, button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #2b374d;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    select, input {
      background: #111722;
      color: #f1f5f9;
    }
    button {
      margin-top: 16px;
      background: #3b82f6;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="loginBox" class="card">
    <h2>CronoNotas Equipe</h2>
    <label for="loginMemberSelect">1. Selecione seu nome na equipe</label>
    <select id="loginMemberSelect"></select>

    <label for="emailInput">2. Seu e-mail</label>
    <input id="emailInput" type="email" placeholder="seu.email@exemplo.com" />

    <label for="passInput">3. Sua senha pessoal</label>
    <input id="passInput" type="password" placeholder="Mínimo 6 caracteres" />

    <button id="enterBtn" type="button">Entrar no Meu Cronograma</button>
    <p id="statusMsg" style="font-size:0.85rem; color:#93c5fd; margin-top:12px;"></p>
  </div>

  <div id="appBox" class="card hidden">
    <h2>Cronograma Ativo</h2>
    <p id="welcomeText"></p>
    <button id="logoutBtn" type="button" style="background:#334155;">Sair</button>
  </div>

  <script>
    const TEAM = [
      { id: "u_gabriel", name: "Gabriel Vieira", role: "Proprietário / Coordenação" },
      { id: "u_aldenan", name: "Aldenan", role: "Agente Social" },
      { id: "u_ana", name: "Ana", role: "Auxiliar Enfermagem" },
      { id: "u_angel", name: "Angel", role: "Agente de Saúde" },
      { id: "u_cilene", name: "Cilene", role: "Agente Social" },
      { id: "u_cleciana", name: "Cleciana", role: "Agente Social" },
      { id: "u_deise", name: "Deise", role: "Auxiliar Enfermagem" },
      { id: "u_diogo", name: "Diogo", role: "Agente de Saúde" },
      { id: "u_giliard", name: "Giliard", role: "Agente de Saúde" },
      { id: "u_jair", name: "Jair", role: "Agente de Saúde" },
      { id: "u_kaique", name: "Kaique", role: "Auxiliar Enfermagem" },
      { id: "u_renata", name: "Renata", role: "Agente de Saúde" },
      { id: "u_rosimeire", name: "Rosimeire", role: "Assistente Social" },
      { id: "u_sheila", name: "Sheila", role: "Psicóloga" },
      { id: "u_talita", name: "Talita", role: "Médica" },
      { id: "u_yasmin", name: "Yasmin", role: "Auxiliar Enfermagem" }
    ];

    const selectEl = document.getElementById("loginMemberSelect");
    const msgEl = document.getElementById("statusMsg");

    function fillNames() {
      selectEl.innerHTML = "";
      TEAM.forEach((person) => {
        const opt = document.createElement("option");
        opt.value = person.id;
        opt.textContent = `${person.name} — ${person.role}`;
        selectEl.appendChild(opt);
      });
      selectEl.value = "u_gabriel";
      msgEl.textContent = `Lista carregada com ${TEAM.length} participantes.`;
    }

    document.getElementById("enterBtn").addEventListener("click", () => {
      const selected = TEAM.find((p) => p.id === selectEl.value) || TEAM[0];
      const email = document.getElementById("emailInput").value.trim();
      const pass = document.getElementById("passInput").value;
      if (!email || pass.length < 6) {
        msgEl.textContent = "Preencha um e-mail e uma senha com pelo menos 6 caracteres.";
        return;
      }
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("appBox").classList.remove("hidden");
      document.getElementById("welcomeText").textContent =
        `Sessão iniciada como ${selected.name} (${selected.role}).`;
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      document.getElementById("appBox").classList.add("hidden");
      document.getElementById("loginBox").classList.remove("hidden");
    });

    fillNames();
  </script>
</body>
</html>
